name: Convergence

on:
  workflow_call:

jobs:
  convergence:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: energy
            tests: tests/training/controller/test_controller_energy*.py

          - target: quadrupole
            tests: tests/training/controller/test_controller_quadrupole*.py

          - target: kicker
            tests: tests/training/controller/test_controller_kicker.py

          - target: acd
            tests: tests/training/controller/test_controller_acd.py

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          path: accelmo
          persist-credentials: false

      - name: Setup CI environment
        uses: ./accelmo/.github/actions/setup-ci

      - name: Run convergence tests
        working-directory: accelmo
        run: |
          pytest -ra \
            ${{ matrix.tests }} \
            -m convergence \
            --cov=accelmo \
            --cov-branch \
            --cov-report=xml:coverage.xml

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: accelmo/coverage.xml
          disable_search: true
          flags: convergence
          name: convergence-${{ matrix.target }}
