name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  fast:
    name: Fast contracts
    uses: ./.github/workflows/_pytest.yml
    with:
      markers: "not serial and not slow and not regression and not convergence"
      coverage-flag: fast
      parallel: true
    secrets: inherit

  serial:
    name: Serial contracts
    needs: fast
    uses: ./.github/workflows/_pytest.yml
    with:
      markers: "serial and not slow and not regression and not convergence"
      coverage-flag: serial
    secrets: inherit

  regression:
    name: Controller regressions
    needs: fast
    uses: ./.github/workflows/_pytest.yml
    with:
      markers: regression
      coverage-flag: regression
    secrets: inherit

  integration:
    name: Slow integration
    needs: fast
    uses: ./.github/workflows/_pytest.yml
    with:
      markers: "slow and not regression and not convergence"
      coverage-flag: integration
    secrets: inherit

  convergence:
    name: Convergence
    needs: regression
    uses: ./.github/workflows/_convergence.yml
    secrets: inherit
